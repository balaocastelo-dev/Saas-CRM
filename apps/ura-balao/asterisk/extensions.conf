; =========================================================================
; DIALPLAN DO ASTERISK PARA URA ATIVA
; Arquivo: extensions.conf
; Copie este arquivo para /etc/asterisk/extensions.conf (ou mescle com o existente)
; =========================================================================

[ura-outbound]
exten => s,1,NoOp(--- INICIANDO URA ATIVA BALAO ---)
same => n,NoOp(Cliente ID: ${CLIENT_ID}, Campanha ID: ${CAMPAIGN_ID}, Telefone: ${PHONE}, Motivo: ${MOTIVO_AUDIO})

; 1. Atendimento da chamada
same => n,Answer()
same => n,Wait(1) ; Pequena pausa para garantir o áudio bidirecional

; 2. Tocar a mensagem da URA
; Quando houver áudio dinâmico, ele já inclui saudação + oferta completa.
same => n,ExecIf($["${PROMO_AUDIO_FILE}" != ""]?Playback(${PROMO_AUDIO_FILE}))

; Se não houver áudio dinâmico, usa o intro fixo e o motivo por categoria.
same => n,ExecIf($["${PROMO_AUDIO_FILE}" = ""]?Playback(ura-balao-intro))

; Fallback para os áudios fixos por categoria
same => n,ExecIf($["${PROMO_AUDIO_FILE}" = ""]?Playback(ura-balao-motivo-${MOTIVO_AUDIO}))

; 3. Capturar a tecla digitada pelo cliente (tempo limite de 7 segundos)
; ura-balao-opcoes: "Digite 1 para falar com um atendente. Digite 2 para receber atendimento pelo WhatsApp. Digite 9 para não receber mais ligações."
same => n,Read(TECLA_DIGITADA,ura-balao-opcoes,1,,1,7)

; Loga a tecla recebida no console do Asterisk
same => n,NoOp(Tecla digitada pelo cliente: ${TECLA_DIGITADA})

; 4. Envia a resposta imediatamente ao backend local por HTTP POST
same => n,System(curl -X POST -H "Content-Type: application/json" -d '{"uniqueid":"${UNIQUEID}", "campaign_id":"${CAMPAIGN_ID}", "client_id":"${CLIENT_ID}", "phone":"${PHONE}", "digit":"${TECLA_DIGITADA}"}' http://localhost:3000/api/asterisk/dtmf-result)

; 5. Executa a ação da tecla digitada
same => n,GotoIf($["${TECLA_DIGITADA}" = "1"]?opcao-1)
same => n,GotoIf($["${TECLA_DIGITADA}" = "2"]?opcao-2)
same => n,GotoIf($["${TECLA_DIGITADA}" = "9"]?opcao-9)
same => n,GotoIf($["${TECLA_DIGITADA}" = ""]?opcao-timeout)
same => n,Goto(opcao-invalida)

; Opção 1: Falar com atendente
same => n(opcao-1),Playback(ura-balao-atendente)
same => n,Hangup()

; Opção 2: Receber atendimento via WhatsApp
same => n(opcao-2),Playback(ura-balao-whatsapp)
same => n,Hangup()

; Opção 9: Blacklist / Não ligar mais
same => n(opcao-9),Playback(ura-balao-bloqueado)
same => n,Hangup()

; Timeout (não digitou nada)
same => n(opcao-timeout),Playback(ura-balao-timeout)
same => n,Hangup()

; Qualquer outra tecla (Inválido)
same => n(opcao-invalida),Playback(ura-balao-invalido)
same => n,Hangup()


; --- Trata o encerramento da chamada ---
exten => h,1,NoOp(--- FINALIZANDO CHAMADA URA ---)
same => n,NoOp(Status final: ${DIALSTATUS}, Tempo: ${ANSWEREDTIME} segundos)
; Envia o status final de encerramento da chamada para o backend
same => n,System(curl -X POST -H "Content-Type: application/json" -d '{"uniqueid":"${UNIQUEID}", "campaign_id":"${CAMPAIGN_ID}", "client_id":"${CLIENT_ID}", "phone":"${PHONE}", "status":"${DIALSTATUS}", "duration":"${ANSWEREDTIME}"}' http://localhost:3000/api/asterisk/call-status)
