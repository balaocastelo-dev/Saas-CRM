<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - URA Ativa Balão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-logo">
      <div class="brand-logo">B</div>
    </div>
    <h2 class="login-title">URA ATIVA BALÃO</h2>
    <p class="login-subtitle">Balão da Informática Castelo</p>

    <form id="login-form">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="username">Usuário</label>
        <input class="form-control" type="text" id="username" placeholder="Digite seu usuário" required>
      </div>

      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="password">Senha</label>
        <input class="form-control" type="password" id="password" placeholder="Digite sua senha" required>
      </div>

      <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 10px;">Entrar no Painel</button>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showToast('Acesso autorizado. Redirecionando...');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } else {
          showToast(data.error || 'Credenciais inválidas.', 'error');
        }
      } catch (err) {
        showToast('Erro ao conectar ao servidor.', 'error');
      }
    });
  </script>
</body>
</html>
